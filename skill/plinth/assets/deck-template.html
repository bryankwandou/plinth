<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7; --ink:#15161A; --muted:#6B6E76; --line:#E4E3DD; --panel:#F1F0EA;
  --accent:#2F5BEA; --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
.dark{ --bg:#111214; --ink:#F2F1EC; --muted:#9A9CA3; --line:#2A2B30; --panel:#1A1B1F; }
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0c0c0e;font-family:var(--font);-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;display:grid;place-items:center}
.deck{width:1280px;height:720px;position:relative;transform-origin:center}
section{position:absolute;inset:0;background:var(--bg);color:var(--ink);padding:64px 64px 56px;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .35s ease}
section.on{opacity:1;pointer-events:auto}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
h1{font-size:72px;line-height:1.02;letter-spacing:-.035em;font-weight:700;max-width:18ch}
h2{font-size:48px;line-height:1.08;letter-spacing:-.025em;font-weight:600;max-width:22ch}
p,li{font-size:24px;line-height:1.45;color:var(--ink);max-width:40ch}
.lede{color:var(--muted);margin-top:24px}
ul{padding:0;list-style:none;margin-top:36px;display:grid;gap:18px}
li{padding-left:28px;position:relative}
li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:2px;background:var(--accent)}
.fill{flex:1;display:flex;flex-direction:column;justify-content:center}
.center{align-items:center;text-align:center} .center h1,.center h2,.center p{margin-inline:auto}
.big{font-size:180px;font-weight:700;letter-spacing:-.05em;line-height:.9;color:var(--accent);font-feature-settings:"tnum"}
.source{margin-top:auto;font-size:14px;color:var(--muted);padding-top:16px}
.row{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;margin-top:40px;flex:1;align-items:center}
.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c4{grid-column:span 4}.c8{grid-column:span 8}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 24px 48px -28px rgba(0,0,0,.25)}
.mono{font-family:var(--mono);font-size:17px;line-height:1.6}
.quote{font-size:36px;line-height:1.3;letter-spacing:-.015em;max-width:30ch}
.who{margin-top:20px;font-size:18px;color:var(--muted)}
.accent{color:var(--accent)}
.stat{border-top:2px solid var(--ink);padding-top:14px}
.stat b{display:block;font-size:56px;letter-spacing:-.03em;font-weight:600;font-feature-settings:"tnum"}
.stat span{font-size:18px;color:var(--muted)}
.bar{height:14px;border-radius:3px;background:var(--line)} .bar.hi{background:var(--accent)}
.foot{position:absolute;left:64px;right:64px;bottom:24px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
aside.notes{display:none}
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:32vh;overflow:auto;background:#16171b;color:#ddd;font:16px/1.5 var(--font);padding:18px 24px;display:none}
#notes.show{display:block}
#hint{position:fixed;right:16px;top:12px;font:12px var(--font);color:#777}
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{background:none} .stage{position:static;display:block} .deck{transform:none!important;width:auto;height:auto}
  section{position:relative;opacity:1;width:1280px;height:720px;page-break-after:always;break-after:page}
  #progress,#notes,#hint{display:none}
}
@media (prefers-reduced-motion:reduce){section{transition:none}}
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck">
<!--SLIDES-->
<section class="center">
  <div class="fill center">
    <h1>Name. One line on who it is for and what changes.</h1>
    <p class="lede">Presenter, role · Event, date</p>
  </div>
  <aside class="notes">What you say while this slide is up, written the way you talk.</aside>
</section>
<!--/SLIDES-->
</div></div>
<div id="progress"></div><div id="notes"></div>
<div id="hint">← → · F fullscreen · N notes · P print</div>
<script>
(()=>{
  const deck=document.getElementById('deck'),S=[...deck.querySelectorAll('section')],bar=document.getElementById('progress'),nb=document.getElementById('notes');
  let i=Math.min(S.length-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
  const fit=()=>{const k=Math.min(innerWidth/1280,innerHeight/720);deck.style.transform=`scale(${k})`};
  const show=n=>{i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,j)=>s.classList.toggle('on',j===i));
    bar.style.width=((i+1)/S.length*100)+'%';history.replaceState(null,'','#'+(i+1));
    const a=S[i].querySelector('aside.notes');nb.textContent=a?a.textContent.trim():'';};
  addEventListener('resize',fit);fit();show(i);
  addEventListener('keydown',e=>{
    if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}
    else if(['ArrowLeft','PageUp'].includes(e.key))show(i-1);
    else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);
    else if(e.key==='f'||e.key==='F')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    else if(e.key==='n'||e.key==='N')nb.classList.toggle('show');
    else if(e.key==='p'||e.key==='P')print();
  });
  let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);
  addEventListener('touchend',e=>{if(x0==null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)show(i+(d<0?1:-1));x0=null});
  deck.addEventListener('click',e=>show(i+(e.clientX>innerWidth/2?1:-1)));
})();
</script>
</body>
</html>
